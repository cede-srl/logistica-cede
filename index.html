<title>Logística CEDE</title>

<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.webmanifest">

<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block;
         padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #0b1220; }

  /* ---------- Pantalla de carga con el logo animado ---------- */
  #carga { position: fixed; inset: 0; z-index: 2; background: #fff; overflow: hidden;
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
           padding: 24px; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #64748b; text-align: center; }
  #carga.fuera { display: none; }
  #logo { width: min(78vw, 440px); height: auto; overflow: visible; }
  .pz { transform-box: fill-box; transform-origin: center; }
  .le, .co { fill: #231f20; }
  .sr, .barra { fill: #dda82d; }
  /* 1) caen las letras de CEDE */
  .le { opacity: 0; animation: cae .55s cubic-bezier(.2,.9,.3,1.25) forwards; animation-delay: calc(var(--i) * .08s); }
  @keyframes cae { from { opacity: 0; transform: translateY(-60%) scale(.7); } to { opacity: 1; transform: none; } }
  /* 2) aparece "srl" con rebote */
  .sr { opacity: 0; animation: pop .5s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: calc(.4s + var(--i) * .07s); }
  @keyframes pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
  /* 3) se dibuja la barra dorada */
  .barra { transform-origin: left center; transform: scaleX(0); animation: barra .5s cubic-bezier(.6,0,.2,1) .65s forwards; }
  @keyframes barra { to { transform: scaleX(1); } }
  /* 4) sube "constructora" */
  .co { opacity: 0; animation: sube .4s ease-out forwards; animation-delay: calc(.95s + var(--i) * .03s); }
  @keyframes sube { from { opacity: 0; transform: translateY(40%); } to { opacity: 1; transform: none; } }
  /* mientras carga: brillo que recorre la barra */
  #luz { animation: luz 1.6s ease-in-out 1.35s infinite; }
  @keyframes luz { from { transform: translateX(0); } to { transform: translateX(1450px); } }
  #estado { opacity: 0; animation: aparece .4s ease 1.3s forwards; min-height: 22px; letter-spacing: .3px; }
  @keyframes aparece { to { opacity: 1; } }
  .pts i { font-style: normal; animation: pt 1.2s infinite; opacity: .2; }
  .pts i:nth-child(2) { animation-delay: .2s; } .pts i:nth-child(3) { animation-delay: .4s; }
  @keyframes pt { 40% { opacity: 1; } }
  #reintentar { margin-top: 12px; border: 0; border-radius: 999px; padding: 10px 18px; font: 600 14px system-ui, sans-serif;
                background: #2563eb; color: #fff; cursor: pointer; display: none; }
  /* onda dorada de la "explosión" */
  #onda { position: fixed; width: 260vmax; height: 260vmax; left: 50%; top: 50%; border-radius: 50%; pointer-events: none; z-index: 3;
          transform: translate(-50%, -50%) scale(0); opacity: 0;
          background: radial-gradient(circle, rgba(221,168,45,0) 38%, rgba(221,168,45,.55) 47%, rgba(255,255,255,.9) 50%, rgba(221,168,45,0) 56%); }
  @media (prefers-reduced-motion: reduce) {
    .le, .sr, .barra, .co, #estado { animation: none; opacity: 1; transform: none; }
    #luz { animation: none; }
  }

  /* Barra para permitir los avisos del celular (el permiso tiene que pedirse con un toque en esta página) */
  #permiso { position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 5; display: none;
             align-items: center; gap: 10px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 14px;
             padding: 12px 14px; font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
             box-shadow: 0 14px 40px rgba(0,0,0,.4); max-width: 520px; margin: 0 auto; }
  #permiso.on { display: flex; }
  #permiso span { flex: 1; }
  #permiso button { border: 0; border-radius: 999px; padding: 9px 14px; font: 600 13px system-ui, sans-serif; cursor: pointer; white-space: nowrap; }
  #permSi { background: #2563eb; color: #fff; }
  #permNo { background: transparent; color: #94a3b8; }
</style>

<script>
  var APP = 'https://script.google.com/a/macros/adeconsa.com.ar/s/AKfycbzeA2WdrARUmYqzylw0yo-xnqzJEmC1eU0Bq8Vdaca5d_FQdN1cx16dQdZDuHu3yUrzoQ/exec';
  // Ya instalada: se lo avisa a la app para que oculte los botones de "Instalar"
  var instalada = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  // ?ver=cuadrilla (al tocar el aviso de una tarea) abre directo ese apartado
  var verAp = (location.search.match(/[?&]ver=(cuadrilla|reportes)(?:&|$)/) || [])[1] || '';
  var qApp = [instalada ? 'pwa=1' : '', verAp ? 'ver=' + verAp : ''].filter(Boolean).join('&');
  document.getElementById('app').src = APP + (qApp ? '?' + qApp : '');

  /* ---------- Pantalla de carga: el logo entra, y cuando la app está lista "explota" ---------- */
  var t0 = Date.now(), abierta = false, INTRO = 1500;
  function abrirApp() {
    if (abierta) return; abierta = true;
    setTimeout(explotar, Math.max(0, INTRO - (Date.now() - t0)));
  }
  function explotar() {
    var c = document.getElementById('carga'), svg = document.getElementById('logo');
    var quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (quieto || !Element.prototype.animate) { c.classList.add('fuera'); return; }
    document.getElementById('estado').style.visibility = 'hidden';
    c.style.pointerEvents = 'none'; // la app ya se puede tocar mientras explota el logo
    setTimeout(function () { c.classList.add('fuera'); }, 2500); // por si el celular frena la animación
    var r = svg.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var u = 1042 / r.width; // píxeles de pantalla -> unidades del dibujo
    // toma impulso...
    svg.animate([{ transform: 'scale(1)' }, { transform: 'scale(.9)' }], { duration: 170, easing: 'ease-in', fill: 'forwards' });
    setTimeout(function () {
      // ...y cada pieza del logo sale volando desde el centro
      document.querySelectorAll('#logo .pz').forEach(function (p) {
        var b = p.getBoundingClientRect(), dx = b.left + b.width / 2 - cx, dy = b.top + b.height / 2 - cy;
        var k = 2.4 + Math.random() * 1.8, gira = (Math.random() - .5) * 160, esc = 1.3 + Math.random() * .9;
        p.style.animation = 'none'; p.style.opacity = 1;
        p.animate([
          { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
          { transform: 'translate(' + (dx * k * u) + 'px,' + ((dy * k - 60) * u) + 'px) rotate(' + gira + 'deg) scale(' + esc + ')', opacity: 0 }
        ], { duration: 700 + Math.random() * 300, easing: 'cubic-bezier(.15,.75,.3,1)', fill: 'forwards' });
      });
      var luz = document.getElementById('luz'); if (luz) luz.style.display = 'none';
      // onda dorada que se abre y destapa la app
      var o = document.getElementById('onda'); o.style.left = cx + 'px'; o.style.top = cy + 'px';
      o.animate([{ transform: 'translate(-50%,-50%) scale(0)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(1)', opacity: 0 }],
                { duration: 950, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
      c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, delay: 380, easing: 'ease-out', fill: 'forwards' })
        .onfinish = function () { c.classList.add('fuera'); };
    }, 170);
  }

  /* ---------- Mensajes con las apps de adentro (Logística, y Cuadrilla adentro de Logística) ---------- */
  // Cada pedido se contesta a la ventana que lo hizo. El permiso y el token de avisos se mandan a todas.
  var diferido = null, pushToken = '';
  var soporta = 'Notification' in window && 'serviceWorker' in navigator;
  var EQUIPO = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'iPhone' : (/Android/i.test(navigator.userAgent) ? 'Android' : 'Compu');
  var TXT_PERMISO = '🔔 ¿Permitir que el celular te avise cuando se entrega un pedido?';
  function estadoPermiso() { return soporta ? Notification.permission : 'no-soportado'; }
  function enviar(w, msg) { try { w && w.postMessage(msg, '*'); } catch (x) {} }
  // A todas las ventanas de adentro: la app de Logística y las que tenga adentro (Cuadrilla, Reportes)
  function aTodas(msg, w, n) {
    w = w || window; n = n || 0;
    if (n > 6) return;
    try { for (var i = 0; i < w.frames.length; i++) { enviar(w.frames[i], msg); aTodas(msg, w.frames[i], n + 1); } } catch (x) {}
  }
  function mensajeToken() { return { cede: 'push-token', token: pushToken, equipo: EQUIPO }; }

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); diferido = e; });
  window.addEventListener('appinstalled', function () { diferido = null; });

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.cede) return;
    try { if (!/\.(googleusercontent|google)\.com$/.test(new URL(e.origin).hostname)) return; } catch (x) { return; }
    var src = e.source;
    // La app ya mostró sus datos: se abre con la animación
    if (d.cede === 'lista') { abrirApp(); return; }
    // Botón "Instalar en Android": si Chrome ofrece instalar, se abre el cartel directamente
    if (d.cede === 'instalar') {
      if (d.so === 'android' && diferido) { enviar(src, { cede: 'ok' }); diferido.prompt(); diferido.userChoice.then(function () { diferido = null; }); }
      return; // si no se puede (iPhone, ya instalada, otro navegador), la app muestra los pasos
    }
    // Una app de adentro pregunta si puede usar los avisos del celular (y recibe el token si ya está)
    if (d.cede === 'hola') { enviar(src, { cede: 'permiso', estado: estadoPermiso() }); if (pushToken) enviar(src, mensajeToken()); return; }
    // Pide activar los avisos: se muestra la barra para que la persona toque "Permitir"
    if (d.cede === 'pedir-permiso') {
      if (estadoPermiso() === 'default') {
        document.getElementById('permTxt').textContent = d.texto ? String(d.texto).slice(0, 160) : TXT_PERMISO;
        document.getElementById('permiso').classList.add('on');
      } else enviar(src, { cede: 'permiso', estado: estadoPermiso() });
      return;
    }
    // Sesión de Cuadrilla y Reportes: en el iPhone se borra lo que guardan las apps de adentro al cerrar,
    // así que se guarda acá (la app instalada) y se les devuelve cuando la piden al abrir
    if (d.cede === 'sesion-guardar') {
      try { if (d.token) localStorage.setItem('cede_sesion_cuadrilla', String(d.token).slice(0, 200)); else localStorage.removeItem('cede_sesion_cuadrilla'); } catch (x) {}
      return;
    }
    if (d.cede === 'sesion-pedir') {
      var tk = ''; try { tk = localStorage.getItem('cede_sesion_cuadrilla') || ''; } catch (x) {}
      try { src.postMessage({ cede: 'sesion', token: tk }, e.origin); } catch (x) {}
      return;
    }
    // Pedido entregado (sin avisos push): notificación del celular si la app no está a la vista
    if (d.cede === 'notif') {
      if (estadoPermiso() !== 'granted' || !document.hidden) return;
      navigator.serviceWorker.ready.then(function (r) {
        return r.showNotification(String(d.titulo || 'Logística CEDE'), { body: String(d.texto || ''), icon: 'icon-192.png', badge: 'icon-192.png', tag: String(d.tag || 'cede'), renotify: true });
      }).catch(function () {});
    }
  });

  document.getElementById('permSi').onclick = function () {
    document.getElementById('permiso').classList.remove('on');
    Notification.requestPermission().then(function () {
      aTodas({ cede: 'permiso', estado: estadoPermiso() });
      iniciarPush();
    });
  };
  document.getElementById('permNo').onclick = function () {
    document.getElementById('permiso').classList.remove('on');
    aTodas({ cede: 'permiso', estado: estadoPermiso() });
  };

  /* ---------- Avisos push (Firebase Cloud Messaging) ---------- */
  // Los datos del proyecto de Firebase están en firebase-config.js (lo que muestra la consola de Firebase en
  // Configuración del proyecto → Tus apps → Config). Con el permiso dado, se pide el token de este celular y se
  // lo pasa a las apps de adentro: cada una lo anota en su planilla (Logística: pedidos entregados;
  // Cuadrilla: tareas asignadas al operario). El aviso lo muestra sw.js aunque la app esté cerrada.
  var FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
  // El service worker se registra siempre (guarda la app para abrir rápido y sin conexión, y muestra los avisos)
  var swListo = ('serviceWorker' in navigator) ? navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }) : Promise.reject(new Error('sin service worker'));
  swListo.catch(function () {});
  function cargarScript(src) {
    return new Promise(function (ok, bad) {
      var s = document.createElement('script'); s.src = src; s.async = true;
      s.onload = ok; s.onerror = function () { bad(new Error('No cargó ' + src)); };
      document.head.appendChild(s);
    });
  }
  function leerConfigFirebase() {
    return fetch('firebase-config.js', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('Falta firebase-config.js');
      return r.text();
    }).then(function (t) {
      var c = {}, m, re = /(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|vapidKey)\s*:\s*["']([^"']+)["']/g;
      while ((m = re.exec(t))) c[m[1]] = m[2];
      if (!c.apiKey || !c.projectId || !c.messagingSenderId || !c.appId) throw new Error('firebase-config.js incompleto');
      return c;
    });
  }
  var pushIniciado = false;
  function iniciarPush() {
    if (pushIniciado || !soporta || estadoPermiso() !== 'granted') return;
    pushIniciado = true;
    var cfg;
    Promise.all([swListo, leerConfigFirebase()]).then(function (r) {
      cfg = r[1];
      return cargarScript(FB + 'firebase-app-compat.js')
        .then(function () { return cargarScript(FB + 'firebase-messaging-compat.js'); })
        .then(function () {
          if (!firebase.apps.length) firebase.initializeApp({ apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId, storageBucket: cfg.storageBucket, messagingSenderId: cfg.messagingSenderId, appId: cfg.appId });
          var op = { serviceWorkerRegistration: r[0] };
          if (cfg.vapidKey) op.vapidKey = cfg.vapidKey;
          return firebase.messaging().getToken(op);
        });
    }).then(function (t) {
      if (!t) throw new Error('sin token');
      pushToken = t;
      aTodas(mensajeToken());
    }).catch(function (e) {
      pushIniciado = false;
      console.warn('Avisos push: ' + ((e && e.message) || e));
    });
  }
  // Al tocar un aviso con la app abierta, sw.js pide ir al apartado (por ejemplo Cuadrilla)
  if ('serviceWorker' in navigator) navigator.serviceWorker.onmessage = function (e) {
    if (e.data && e.data.cede === 'ir') aTodas({ cede: 'ir', ver: String(e.data.ver || '') });
  };
  iniciarPush();

  /* ---------- Carga lenta / sin conexión ---------- */
  // Si la app carga pero no avisa (versión vieja del script), se abre igual a los 5 segundos
  document.getElementById('app').addEventListener('load', function () { setTimeout(abrirApp, 5000); });
  function sinConexion() {
    if (abierta) return;
    document.getElementById('msg').textContent = 'Sin conexión a internet. Revisá los datos o el wifi.';
    document.getElementById('pts').style.display = 'none';
    document.getElementById('reintentar').style.display = 'inline-block';
  }
  if (!navigator.onLine) sinConexion();
  window.addEventListener('offline', sinConexion);
  window.addEventListener('online', function () { if (!abierta) location.reload(); });
  setTimeout(function () { if (!abierta) document.getElementById('msg').textContent = 'Está tardando más de lo normal'; }, 15000);
</script>
</body>
</html>
